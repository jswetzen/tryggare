# Production environment: single container that builds the frontend and serves it
# alongside the Django API on port 8080. Triggered by `make rebuild-prod` (writes
# to restart.txt, which the host-side `watch.nu` picks up).
name: ${COMPOSE_PROJECT_NAME:-tryggare-prod}
services:
  # Django backend serving both API and frontend
  # Frontend is built in the Dockerfile's first stage
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      # Empty strings = use relative paths (browser uses current host/port)
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
      - VALKEY_URL=${VALKEY_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # Absolute base URL used server-side for links this container can't render
      # relative (registration/payment emails, admin "view on site"). This is
      # the local prod-like target, which must keep booting with no operator
      # action, so it defaults to this compose file's own published port;
      # override if you point it at a different host.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:8080}
      # Cookie security: set to 'false' for HTTP testing, 'true' for HTTPS/reverse proxy
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-false}
      # Demo mode: shows credentials on login page and resets data hourly
      - DEMO_MODE=${DEMO_MODE:-false}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - SEED_DEMO_RESET=${SEED_DEMO_RESET:-false}
      # Email (SMTP) — optional, see notifications/providers.py. Leave
      # EMAIL_HOST blank only with DEMO_MODE=true or EMAIL_DISABLED_ACK=true
      # set below, or this deployment refuses to start (notifications/apps.py).
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      # Explicit "yes, I really am running this without email" acknowledgement
      # (see notifications/apps.py). Never default this to true.
      - EMAIL_DISABLED_ACK=${EMAIL_DISABLED_ACK:-false}
    ports:
      - "${WEB_HOST_PORT:-8080}:8000"
    labels:
      traefik.enable: "${TRAEFIK_ENABLE:-false}"
      traefik.http.routers.tryggare.rule: "Host(`${TRAEFIK_HOST:-tryggare.example.com}`)"
      traefik.http.routers.tryggare.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.tryggare.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-le}"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
    depends_on:
      db-prod:
        condition: service_healthy
      valkey-prod:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - traefik
#    deploy:
#      resources:
#        limits:
#          cpus: ${WEB_CPU_LIMIT:-2.0}
#          memory: ${WEB_MEMORY_LIMIT:-2G}
#        reservations:
#          cpus: ${WEB_CPU_RESERVATION:-0.5}
#          memory: ${WEB_MEMORY_RESERVATION:-512M}
    restart: unless-stopped
    logging:
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILES:-3}"

  db-prod:
    image: ${POSTGRES_IMAGE:-docker.io/postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkins}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Port exposure removed for security - use Docker network for access
    # For testing, use: podman exec -it <container> psql -U ${DB_USER} checkins
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    networks:
      - backend
#    deploy:
#      resources:
#        limits:
#          cpus: ${DB_CPU_LIMIT:-1.0}
#          memory: ${DB_MEMORY_LIMIT:-1G}
#        reservations:
#          cpus: ${DB_CPU_RESERVATION:-0.25}
#          memory: ${DB_MEMORY_RESERVATION:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILES:-3}"

  valkey-prod:
    image: ${VALKEY_IMAGE:-docker.io/valkey/valkey:7-alpine}
    command: valkey-server --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - backend
#    deploy:
#      resources:
#        limits:
#          cpus: ${VALKEY_CPU_LIMIT:-0.5}
#          memory: ${VALKEY_MEMORY_LIMIT:-512M}
#        reservations:
#          cpus: ${VALKEY_CPU_RESERVATION:-0.1}
#          memory: ${VALKEY_MEMORY_RESERVATION:-128M}
    healthcheck:
      test: ["CMD", "sh", "-c", "valkey-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # Backend network has no external access
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  pg_data_prod:
