name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: checkins
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci
      ENV_FILE: /dev/null
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: checkins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v

      - name: Lint with ruff
        run: uv run ruff check .

  design-tokens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check design tokens stay in sync
        run: npm run check:tokens

  # Same shape as design-tokens above, for the other surface that degrades
  # silently: Django admin is customer-facing (decision D4) and Swedish
  # volunteers read it, but a missing catalogue entry does not raise — gettext
  # just falls back to English. Its own job, not a step in `test`, so the
  # failure reads as "catalogue is stale", not "tests broke".
  messages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # makemessages shells out to xgettext, which is not on the runner image.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check translation catalogues are complete
        run: uv run python scripts/check_messages.py
