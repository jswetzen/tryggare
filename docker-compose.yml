# Development environment: separate frontend (port 5173, genuinely hot-reload
# via Vite) and backend (port 8000) containers. Run with `podman compose up -d`
# from repo root.
#
# The backend does NOT autoreload — it runs plain daphne (needed for
# WebSocket/ASGI support; django.contrib.staticfiles still wins the
# `runserver` command override even with channels installed, so swapping to
# `manage.py runserver` would silently drop WebSocket support). Code changes
# land in the container immediately via the bind mount below, but daphne only
# imports Python once at startup — restart the container to pick them up:
# `podman restart tryggare_web_1` (or `podman compose restart web`).
#
# name: pinned explicitly (matching docker-compose.prod.yml's own
# COMPOSE_PROJECT_NAME-overridable pattern) rather than left to default to the
# repo directory's basename, so `podman compose` here always resolves to the
# same project regardless of what directory it's invoked from.
version: '3.9'
name: ${COMPOSE_PROJECT_NAME:-tryggare}

services:
  web:
    build: ./backend
    command: >-
      sh -c "uv sync --frozen --no-dev &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate --noinput &&
      exec uv run python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file:
      - backend/.env.example
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - valkey
    logging:
      options:
        max-size: "50m"
        path: ./web.log

  frontend:
    build: ./frontend
    command: >-
      sh -c "CI=true pnpm install --frozen-lockfile &&
      exec pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://web:8000  # Server-side (SvelteKit -> Django)
      - VITE_PUBLIC_API_BASE_URL=http://localhost:8000/api  # Client-side (Browser -> Django)
      - VITE_PUBLIC_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - web
    logging:
      options:
        max-size: "50m"
        path: ./frontend.log

  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: checkins
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: docker.io/valkey/valkey:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  backend_venv:
  frontend_node_modules:
  static_files:
